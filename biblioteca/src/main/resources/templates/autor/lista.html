<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Autores</title>
</head>
<body>
    <h1>Autores</h1>
    <a th:href="@{/autores/novo}">Novo autor</a> |
    <a th:href="@{/}">Voltar</a>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Nacionalidade</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="a : ${autores}">
                <td th:text="${a.id}"></td>
                <td th:text="${a.nome}"></td>
                <td th:text="${a.nacionalidade}"></td>
                <td>
                    <form th:action="@{/autores/excluir/{id}(id=${a.id})}" method="post">
                        <button type="submit">Excluir</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(autores)}">
                <td colspan="4">Nenhum autor cadastrado.</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
