<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Categorias</title>
</head>
<body>
    <h1>Categorias</h1>
    <a th:href="@{/categorias/novo}">Nova categoria</a>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="c : ${categorias}">
                <td th:text="${c.id}"></td>
                <td th:text="${c.nome}"></td>
                <td>
                    <form th:action="@{/categorias/excluir/{id}(id=${c.id})}" method="post">
                        <button type="submit">Excluir</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(categorias)}">
                <td colspan="3">Nenhuma categoria cadastrada.</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
